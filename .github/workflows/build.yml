name: Build AutoPatches

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - auto-config

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Procursus tools
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Setup RootHide Theos
        uses: NyaMisty/theos-action@master
        with:
          theos-src: https://github.com/roothide/theos

      - name: Verify toolchain
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -eux
          test -d "$THEOS"
          find "$THEOS/sdks" -maxdepth 1 -type d -name 'iPhoneOS*.sdk' -print
          make --version
          clang --version

      - name: Build Dobby for iPhoneOS
        run: |
          set -eux
          git clone --depth 1 --recurse-submodules https://github.com/jmpews/Dobby.git ../Dobby-master
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for ARCH in arm64 arm64e; do
            cmake -S ../Dobby-master -B "../Dobby-master/cmake-build-$ARCH"               -DCMAKE_SYSTEM_NAME=iOS               -DCMAKE_OSX_SYSROOT="$SDK"               -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0               -DCMAKE_OSX_ARCHITECTURES="$ARCH"               -DDOBBY_GENERATE_SHARED=OFF               -DDOBBY_DEBUG=OFF               -DDOBBY_BUILD_EXAMPLE=OFF               -DDOBBY_BUILD_TEST=OFF               -DNearBranch=ON
            cmake --build "../Dobby-master/cmake-build-$ARCH" --config Release --parallel 2
          done
          ARM64_LIB="$(find ../Dobby-master/cmake-build-arm64 -name libdobby.a -type f -print -quit)"
          ARM64E_LIB="$(find ../Dobby-master/cmake-build-arm64e -name libdobby.a -type f -print -quit)"
          test -n "$ARM64_LIB"
          test -n "$ARM64E_LIB"
          mkdir -p ../Dobby-master/build/iphoneos/universal
          lipo -create "$ARM64_LIB" "$ARM64E_LIB" -output ../Dobby-master/build/iphoneos/universal/libdobby.a
          lipo -info ../Dobby-master/build/iphoneos/universal/libdobby.a

      - name: Build AutoPatches
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -eux
          make clean
          set -o pipefail
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide 2>&1 | tee build.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AutoPatches-build-log-${{ github.sha }}
          path: build.log
          if-no-files-found: warn

      - name: Inspect package
        run: |
          set -eux
          ls -lah packages/
          deb="$(find packages -maxdepth 1 -type f -name '*.deb' | head -n1)"
          test -n "$deb"
          dpkg-deb -I "$deb"
          rm -rf /tmp/autopatches-pkg
          mkdir -p /tmp/autopatches-pkg
          dpkg-deb -x "$deb" /tmp/autopatches-pkg
          test -f /tmp/autopatches-pkg/usr/lib/DynamicPatches/AutoPatches.dylib
          file /tmp/autopatches-pkg/usr/lib/DynamicPatches/AutoPatches.dylib
          lipo -info /tmp/autopatches-pkg/usr/lib/DynamicPatches/AutoPatches.dylib

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: AutoPatches-roothide-${{ github.sha }}
          path: packages/*.deb
          if-no-files-found: error
