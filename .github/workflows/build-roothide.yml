name: Build DynamicPatches

on:
  workflow_dispatch:
  push:
    branches:
      - auto-fixed-path-runtime

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/roothide/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build Dobby
        run: |
          git clone --depth 1 https://github.com/jmpews/Dobby.git Dobby-master
          for arch in arm64 arm64e; do
            cmake -S Dobby-master -B "Dobby-master/build/iphoneos-$arch" \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_SYSTEM_PROCESSOR="$arch" \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES="$arch" \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
              -DCMAKE_BUILD_TYPE=Release \
              -DPlugin.SymbolResolver=ON \
              -DNearBranch=ON \
              -DCMAKE_C_FLAGS="-arch $arch" \
              -DCMAKE_CXX_FLAGS="-arch $arch" \
              -DCMAKE_ASM_FLAGS="-arch $arch"
            cmake --build "Dobby-master/build/iphoneos-$arch" --target dobby_static --config Release
            find "Dobby-master/build/iphoneos-$arch" -name libdobby.a -type f -exec cp {} "./libdobby-$arch.a" \;
            lipo -info "./libdobby-$arch.a"
          done
          rm -f ./libdobby.a
          lipo -create ./libdobby-arm64.a ./libdobby-arm64e.a -output ./libdobby.a
          lipo -info ./libdobby.a
          test -f ./libdobby.a


      - name: Build
        run: |
          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: DynamicPatches-roothide
          path: packages/*.deb
          if-no-files-found: error
